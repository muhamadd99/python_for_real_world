<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resume Helper Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
      #chat-history { height: 60vh; overflow-y: auto; background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 0.375rem; }
      .message { margin-bottom: 1rem; padding: 0.75rem 1rem; border-radius: 0.5rem; max-width: 75%; }
      .user-message { background-color: #0d6efd; color: white; margin-left: auto; }
      .bot-message { background-color: #e9ecef; color: black; margin-right: auto; }
    </style>
  </head>
  <body class="bg-light">

    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card shadow-sm">
            <div class="card-header bg-primary text-white text-center"><h4 class="mb-0">Resume Helper Chatbot</h4></div>
            <div class="card-body">
              
              <div id="chat-history" class="p-3 mb-3 d-flex flex-column">
                <div class="message bot-message">Hello! Upload your resume PDF so I can compare it with our job-skill database, then type a message to begin.</div>
              </div>
              
              <div class="input-group mb-2">
                <input type="text" id="user-input" class="form-control" placeholder="Type your message here...">
                <button class="btn btn-primary" id="send-btn" type="button">Send</button>
              </div>
              
              <div>
                <label for="pdf-file" class="form-label small text-muted">Upload Resume (PDF only):</label>
                <input class="form-control form-control-sm" type="file" id="pdf-file" accept=".pdf">
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.getElementById('send-btn').addEventListener('click', sendMessage); //register send button
      document.getElementById('user-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); }); //register enter button

      async function sendMessage() {
          const inputEl = document.getElementById('user-input'); //document is built-in global object
          const fileEl = document.getElementById('pdf-file');
          const text = inputEl.value.trim();
          const file = fileEl.files[0];
          
          if (!text && !file) return;

          appendMessage(text || "Uploaded a file...", 'user-message');
          inputEl.value = '';

          // Wrap everything into a FormData object to pass securely to python server
          const formData = new FormData();
          formData.append('message', text); //make the payload in form-data format. form mimics multipart/form-data.
          if (file)
		    formData.append('file', file);

          try {
              appendMessage("Thinking...", 'bot-message loading-state');
              
              const response = await fetch('/send-message', { method: 'POST', body: formData });
              const data = await response.json();
              
              document.querySelector('.loading-state')?.remove(); //find the loading state and remove
              appendMessage(data.reply || data.error || "No response received.", 'bot-message');
          } catch (error) {
              document.querySelector('.loading-state')?.remove();
              appendMessage("Error communicating with frontend server.", 'bot-message');
          }
      }

      function appendMessage(text, className) {
          const history = document.getElementById('chat-history');
          const div = document.createElement('div');
          div.className = `message ${className}`;
          div.textContent = text;
          history.appendChild(div); //append the prev chat in div format to the history chat
          history.scrollTop = history.scrollHeight; //by setting them equal ensure that it scrolll down automatically
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
