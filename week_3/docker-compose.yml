services:
  backend:
    image: backend
    pull_policy: build
    build:
      context: backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    env_file:
      - .env
    networks:
      - network-bridge

  frontend:
    image: frontend
    pull_policy: build
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:8000"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - network-bridge

networks:
  network-bridge:
    driver: bridge
