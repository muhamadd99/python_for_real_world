[build-system]
requires = ["setuptools==70.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autosport-pay-backend"
version = "0.1.0"
description = "Telegram userbot pipeline for receipt parsing and validation"
requires-python = ">=3.14"
dependencies = [
  "telethon==1.36.0",
  "pypdf==4.2.0",
  "pillow==10.4.0",
  "pytesseract==0.3.13",
  "pdf2image==1.17.0",
  "fastapi==0.111.0",
  "uvicorn==0.30.1",
  "python-multipart==0.0.9",
  "python-dotenv==1.0.1",
  "pytest==8.2.2",
  "google-genai>=1.0.0",
]

[tool.ruff]
line-length = 100

[tool.setuptools]
packages = ["src"]
